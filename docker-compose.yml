services:
  web:
    image: mymp:latest
    container_name: mymp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:3000"
    networks:
      - caddy_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The সংসদ jobs and the rebuilds that follow them, on their own clock
  # (sangsad/worker/src/scheduler.ts, image from sangsad/Dockerfile).
  worker:
    image: mymp-worker:latest
    container_name: mymp-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # The host's network: the database URL in .env resolves exactly as it does
    # for a job started by hand on the VPS, and the site answers the worker's
    # /api/cron calls on 127.0.0.1:5000, the port published above.
    network_mode: host

networks:
  caddy_net:
    external: true
    name: caddy_net
